```yaml
name: Build APK
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-35 build-tools;35.0.0' }
      - name: Write project files
        run: |
          cat > settings.gradle <<'PROJECT_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name="CrocBot"
          include(":app")
          PROJECT_EOF
          cat > build.gradle <<'PROJECT_EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          PROJECT_EOF
          mkdir -p app/src/main/java/com/example/crocbot
          mkdir -p app/src/main/res/values app/src/main/res/xml
          cat > app/build.gradle <<'PROJECT_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.crocbot'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.crocbot'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '0.1'
              }
          }
          PROJECT_EOF
          cat > app/src/main/AndroidManifest.xml <<'PROJECT_EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application android:theme="@style/AppTheme" android:label="@string/app_name" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".CrocAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          PROJECT_EOF
          cat > app/src/main/res/values/strings.xml <<'PROJECT_EOF'
          <resources>
              <string name="app_name">Croc Bot</string>
          </resources>
          PROJECT_EOF
          cat > app/src/main/res/values/styles.xml <<'PROJECT_EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#00AA55</item>
              </style>
          </resources>
          PROJECT_EOF
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'PROJECT_EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/app_name"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="50"
              android:canRetrieveWindowContent="false" />
          PROJECT_EOF
          cat > app/src/main/java/com/example/crocbot/MainActivity.kt <<'PROJECT_EOF'
          package com.example.crocbot

          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : android.app.Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val title = TextView(this).apply {
                      text = "\uD83D\uDC0A Croc Bot — FAST MODE"
                      textSize = 24f
                      setPadding(24, 40, 24, 24)
                  }
                  val info = TextView(this).apply {
                      text = "1. Enable the Accessibility Service below.\n2. Open TikTok and start the emoji game.\n3. Return here and press START.\n\nEmergency stop: press STOP."
                      textSize = 16f
                      setPadding(24, 10, 24, 30)
                  }
                  val settings = Button(this).apply {
                      text = "OPEN ACCESSIBILITY SETTINGS"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  val start = Button(this).apply {
                      text = "START FAST MODE"
                      setOnClickListener { CrocAccessibilityService.running = true }
                  }
                  val stop = Button(this).apply {
                      text = "STOP"
                      setOnClickListener { CrocAccessibilityService.running = false }
                  }

                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(title)
                      addView(info)
                      addView(settings)
                      addView(start)
                      addView(stop)
                  }
                  setContentView(box)
              }
          }
          PROJECT_EOF
          cat > app/src/main/java/com/example/crocbot/CrocAccessibilityService.kt <<'PROJECT_EOF'
          package com.example.crocbot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import kotlin.math.max
          import kotlin.math.min

          class CrocAccessibilityService : AccessibilityService() {
              companion object {
                  @Volatile var running = false
              }

              private var lastMove = 0L
              private var direction = 1

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!running) return
                  val now = System.currentTimeMillis()
                  if (now - lastMove < 180) return
                  lastMove = now
                  swipe(direction)
                  direction *= -1
              }

              private fun swipe(dir: Int) {
                  val dm = resources.displayMetrics
                  val x = dm.widthPixels * 0.5f
                  val y = dm.heightPixels * 0.72f
                  val dx = dm.widthPixels * 0.28f * dir
                  val path = Path().apply {
                      moveTo(x, y)
                      lineTo(min(dm.widthPixels.toFloat(), max(0f, x + dx)), y)
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 90)
                  dispatchGesture(
                      GestureDescription.Builder().addStroke(stroke).build(),
                      null,
                      null
                  )
              }

              override fun onInterrupt() {
                  running = false
              }
          }
          PROJECT_EOF
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: crocbot-apk, path: app/build/outputs/apk/debug/*.apk }
